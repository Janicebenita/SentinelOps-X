services:
  - type: web
    name: janicebenita-sentinelops-nexus-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: mock
      - key: AI_PROVIDER
        value: mock
      - key: PRODUCTION_EXECUTION
        value: false
      - key: ENVIRONMENT
        value: production
      - key: INTERN_ACCESS_CODE
        value: "0000"
      - key: SENIOR_ACCESS_CODE
        value: "1111"
      - key: ROLE_TOKEN_SECRET
        generateValue: true
      - key: INTEGRATION_TOKEN
        generateValue: true
      - key: ROLE_TOKEN_EXPIRY_MINUTES
        value: "10"
      - key: DATABASE_URL
        value: sqlite:////tmp/sentinelops-nexus.db
      - key: DEMO_REPO_PATH
        value: .
      - key: DEMO_APP_URL
        value: https://janicebenita-sentinelops-nexus-simulator.onrender.com
      - key: CORS_ORIGINS
        value: https://janicebenita-sentinelops-nexus.onrender.com

  - type: web
    name: janicebenita-sentinelops-nexus-simulator
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn demo_app.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: janicebenita-sentinelops-nexus
    runtime: static
    branch: main
    buildCommand: corepack enable && cd frontend && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_BASE_URL
        value: https://janicebenita-sentinelops-nexus-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; connect-src 'self' https://janicebenita-sentinelops-nexus-api.onrender.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'
