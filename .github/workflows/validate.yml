name: Validate SentinelOps
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: python -m pip install -e ".[dev]"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Frontend type check
        run: pnpm exec tsc --noEmit
        working-directory: frontend
      - name: Frontend production build
        run: pnpm run build
        working-directory: frontend
      - run: make test
      - run: make lint
      - run: make typecheck
      - run: make security
      - name: Start complete demo
        run: SENTINELOPS_SKIP_SANDBOX_BUILD=1 make demo > /tmp/sentinelops-demo.log 2>&1 &
      - run: python scripts/health_check.py
      - name: Validate Nexus workflow end to end
        run: python scripts/nexus_e2e.py
      - name: Demo log
        if: always()
        run: test ! -f /tmp/sentinelops-demo.log || cat /tmp/sentinelops-demo.log
