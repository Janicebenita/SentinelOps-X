# Replace PROJECT_ID and REVISION. Internal services intentionally omit public invoker bindings.
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: sentinelops-api-gateway}
spec: {template: {metadata: {annotations: {autoscaling.knative.dev/minScale: '0', autoscaling.knative.dev/maxScale: '5'}}, spec: {serviceAccountName: sentinelops-api@PROJECT_ID.iam.gserviceaccount.com, containerConcurrency: 40, timeoutSeconds: 60, containers: [{image: us-central1-docker.pkg.dev/PROJECT_ID/sentinelops/api:REVISION, ports: [{containerPort: 8080}], env: [{name: PRODUCTION_EXECUTION, value: 'false'}, {name: INTEGRATION_TOKEN, valueFrom: {secretKeyRef: {name: sentinelops-integration-token, key: latest}}}, {name: ROLE_TOKEN_SECRET, valueFrom: {secretKeyRef: {name: sentinelops-role-token-secret, key: latest}}}], resources: {limits: {cpu: '1', memory: 512Mi}}}]}}}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: sentinelops-orchestrator}
spec: {template: {spec: {serviceAccountName: sentinelops-orchestrator@PROJECT_ID.iam.gserviceaccount.com, containerConcurrency: 20, containers: [{image: us-central1-docker.pkg.dev/PROJECT_ID/sentinelops/orchestrator:REVISION, ports: [{containerPort: 8080}], env: [{name: PRODUCTION_EXECUTION, value: 'false'}]}]}}}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: sentinelops-forecast-service}
spec: {template: {spec: {serviceAccountName: sentinelops-forecast@PROJECT_ID.iam.gserviceaccount.com, containers: [{image: us-central1-docker.pkg.dev/PROJECT_ID/sentinelops/forecast:REVISION, ports: [{containerPort: 8080}], env: [{name: PRODUCTION_EXECUTION, value: 'false'}]}]}}}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: sentinelops-simulation-service}
spec: {template: {spec: {serviceAccountName: sentinelops-simulation@PROJECT_ID.iam.gserviceaccount.com, containers: [{image: us-central1-docker.pkg.dev/PROJECT_ID/sentinelops/simulator:REVISION, ports: [{containerPort: 8080}], env: [{name: PRODUCTION_EXECUTION, value: 'false'}]}]}}}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: sentinelops-verification-service}
spec: {template: {spec: {serviceAccountName: sentinelops-verification@PROJECT_ID.iam.gserviceaccount.com, containers: [{image: us-central1-docker.pkg.dev/PROJECT_ID/sentinelops/verification:REVISION, ports: [{containerPort: 8080}], env: [{name: PRODUCTION_EXECUTION, value: 'false'}]}]}}}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: sentinelops-gemma-service}
spec: {template: {spec: {serviceAccountName: sentinelops-gemma@PROJECT_ID.iam.gserviceaccount.com, containers: [{image: us-central1-docker.pkg.dev/PROJECT_ID/sentinelops/gemma:REVISION, ports: [{containerPort: 8080}], env: [{name: PRODUCTION_EXECUTION, value: 'false'}], resources: {limits: {cpu: '2', memory: 2Gi}}}]}}}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: sentinelops-evidence-service}
spec: {template: {spec: {serviceAccountName: sentinelops-evidence@PROJECT_ID.iam.gserviceaccount.com, containers: [{image: us-central1-docker.pkg.dev/PROJECT_ID/sentinelops/evidence:REVISION, ports: [{containerPort: 8080}], env: [{name: PRODUCTION_EXECUTION, value: 'false'}]}]}}}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: sentinelops-frontend}
spec: {template: {spec: {containerConcurrency: 80, containers: [{image: us-central1-docker.pkg.dev/PROJECT_ID/sentinelops/frontend:REVISION, ports: [{containerPort: 8080}]}]}}}
