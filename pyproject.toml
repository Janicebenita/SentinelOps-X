[project]
name = "sentinelops-nexus"
version = "2.0.0"
description = "Evidence-driven Enterprise Operational Digital Twin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-json-logger>=2,<4",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]
[project.optional-dependencies]
# Developer-only verification tools are kept out of production images. The
# single `dev` extra keeps local and CI setup reproducible.
dev = [
  "bandit>=1.7,<2",
  "mypy>=1.11,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
storytelling = [
  "Pillow>=11,<12",
  "edge-tts==7.2.3",
  "imageio-ffmpeg>=0.6,<1",
  "playwright==1.55.0",
]
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["backend*", "demo_app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "demo_app/tests"]
addopts = "--strict-markers"
[tool.coverage.run]
branch = true
source = ["backend", "demo_app"]
[tool.coverage.report]
show_missing = true
skip_covered = true
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701", "E702", "E703", "I001", "B008", "F403", "F405"]
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["frontend"]
[tool.bandit]
exclude_dirs = ["backend/tests", "demo_app/tests"]
