substitutions: {_REGION: asia-south1}
steps:
- name: gcr.io/cloud-builders/docker
  args: [build, -f, Dockerfile.mcp, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/sentinelops/mcp:$COMMIT_SHA', .]
images:
- '${_REGION}-docker.pkg.dev/$PROJECT_ID/sentinelops/mcp:$COMMIT_SHA'
options: {logging: CLOUD_LOGGING_ONLY}
